version: 2

models:
  - name: mart_driver_leaderboard
    description: "Ranks drivers by total net revenue generated."
    config:
        meta:
          data_owner: "Operations Team"
        tags: ["operations"]
    columns:
      - name: driver_id
        description: "To uniquely identify the driver."
        tests: 
          - not_null
          - unique
      - name: total_trips
        description: "Number of completed trips by this driver."
      - name: total_net_revenue
        description: "Total net revenue generated by this driver across all completed trips."
      - name: avg_fare_per_trip
        description: "Average actual fare per completed trip for this driver."
      - name: last_trip_at
        description: "Timestamp of the driver's most recent completed trip."
      - name: driver_lifetime_trips
        description: "Total lifetime trips completed by this driver"

  - name: mart_driver_activity
    description: "Daily activity summary per driver."
    config:
        meta:
          data_owner: "Operations Team"
        tags: ["operations"]
    columns:
      - name: driver_id
        description: "To identify driver uniquely."
        tests: 
        - not_null
      - name: activity_date
        description: "The date of activity, truncated to day."
        tests: 
          - not_null
      - name: trips_on_day
        description: "Number of completed trips the driver made on this day."
      - name: total_drive_time_minutes
        description: "Total minutes spent driving from pickup to dropoff on this day."
      - name: daily_earnings
        description: "Net revenue generated by this driver on this day."

  - name: mart_rider_ltv
    description: "Lifetime value summary per rider."
    config:
        meta:
          data_owner: "Operations Team"
        tags: ["operations"]
    columns:
      - name: rider_id
        description: "This is used to uniquely identify the rider."
        tests: 
          - not_null
      - name: total_trips
        description: "Total number of completed trips taken by this rider."
      - name: first_trip_at
        description: "Timestamp of the rider's very first completed trip."
      - name: last_trip_at
        description: "Timestamp of the rider's most recent completed trip."
      - name: gross_spend
        description: "Total amount charged to this rider across all completed trips."
      - name: ltv
        description: "Rider lifetime value — net revenue BeejanRide has earned from this rider."

  - name: mart_surge_impact
    description: "Daily analysis of surge pricing impact on revenue per city. To evaluate surge impact."
    config:
        meta:
          data_owner: "Operations Team"
        tags: ["operations"]
    columns:
      - name: trip_date
        description: "Date of trips, truncated to day."
        tests: 
        - not_null
      - name: city_id
        description: "City where the trips occurred."
        tests: 
          - not_null
      - name: total_trips
        description: "Total completed trips on this day in this city."
      - name: extreme_surge_trips
        description: "Number of trips with a surge multiplier greater than 10x."
      - name: avg_fare
        description: "Average actual fare across all completed trips on this day in this city."
      - name: total_net_revenue
        description: "Total net revenue on this day in this city, including surge-inflated fares."

  - name: mart_driver_churn_tracking
    description: "Tracks driver engagement status based on recency of last completed trip. Used for churn prevention and driver retention."
    config:
        meta:
          data_owner: "Operations Team"
        tags: ["operations"]
    columns:
      - name: driver_id
        description: "To identify drivers uniquely"
        tests: 
          - not_null 
          - unique
      - name: last_trip_at
        description: "Timestamp of the driver's most recent completed trip."
      - name: driver_lifetime_trips
        description: "Total lifetime trips completed by this driver."
      - name: days_since_last_trip
        description: "Number of days elapsed since the driver's last completed trip."
      - name: churn_status
        description: "Driver engagement analyzer. active = drove within 14 days, at_risk = 14-30 days inactive, churned = over 30 days inactive."
        tests:
          - accepted_values:
              values: ["active", "at_risk", "churned"]