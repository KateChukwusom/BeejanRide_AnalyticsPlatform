version: 2

models:
  - name: int_trips_enriched
    description: "This model transforms the raw trip table by applying different metrics"

    columns:
      - name: trip_id
        description: "Unique key for identifying staging trips table"
        tests:
          - unique
          - not_null

      - name: driver_id
        description: "Unique key for identifying staging drivers table"
        tests:
          - not_null

      - name: rider_id
        description: "Unique key for identifying staging riders table"
        tests:
          - not_null

      - name: trip_status
        description: "This is the metric for evaluating a trip's instance"
        tests:
          - accepted_values:
              values: ['cancelled', 'completed']

      - name: trip_duration_minutes
        description: "The amount of time in minutes a trip is completed"
        tests:
          - not_null

      - name: corporate_trip_flag
        description: "A flag that indicates the trip is sponsored by corporate"
        tests:
          - accepted_values:
              values: [0, 1]

      - name: net_revenue
        description: "Actual income after deducting platform fee"
        tests:
          - not_null

      - name: extreme_surge_multiplier
        description: "A flag that detects anomally in surge multiplier"
        tests:
          - accepted_values:
              values: [0, 1]

      - name: duplicate_trip_payments
        description: "A flag that detects duplicate trip payments"
        tests:
          - accepted_values:
              values: [0, 1]

      - name: failed_payments_on_completed_trip
        description: "A flag that detects failed payments for completed trip"
        tests:
          - accepted_values:
              values: [0, 1]

      - name: fraud_indicators
        description: "A flag that indicates fraud indicators"
        tests:
          - accepted_values:
              values: [0, 1]

  - name: int_drivers
    description: "This model transforms the staging drivers layer by applying measures and metrics"

    columns:
      - name: trip_id
        description: "Foreign key, a unique key for the trips table"
        tests:
          - not_null

      - name: driver_id
        description: "Unique key for identifying drivers table"
        tests:
          - not_null

      - name: driver_lifetime_trips
        description: "A metric for measuring the total trips of a driver from onboarding date"
        tests:
          - not_null

  - name: int_riders
    description: "This model transforms the staging riders layer by applying measures and metrics"

    columns:
      - name: trip_id
        description: "Foreign key, a unique key for the trips table"
        tests:
          - not_null

      - name: rider_id
        description: "Unique key for identifying riders table"
        tests:
          - not_null

      - name: rider_lifetime_value
        description: "A metric for measuring the total revenue spent of a rider from signup date"
        tests:
          - not_null